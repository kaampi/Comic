name: Patch panel text types

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-panel-text-types.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch panel editor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/App.tsx')
          s = p.read_text(encoding='utf-8')

          old = 'bubbleStyle:"organic" as const,tailCurve:previous?.tailCurve??0,tailRootWidth:previous?.tailRootWidth??50,roundness:previous?.roundness??60,tailX:type==="speech"?(previous?.tailX!==undefined?previous.tailX+dx:x+width*.65):undefined,tailY:type==="speech"?(previous?.tailY!==undefined?previous.tailY+dy:y+height*1.15):undefined}'
          new = 'bubbleStyle:"organic" as const,tailEnabled:type==="speech"?(previous?.tailEnabled??true):false,tailCurve:previous?.tailCurve??0,tailRootWidth:previous?.tailRootWidth??50,roundness:previous?.roundness??(type==="caption"?18:60),tailX:type==="speech"?(previous?.tailX!==undefined?previous.tailX+dx:x+width*.65):undefined,tailY:type==="speech"?(previous?.tailY!==undefined?previous.tailY+dy:y+height*1.15):undefined}'
          assert old in s, 'addOverlay anchor not found'
          s = s.replace(old, new, 1)

          old = 'o.type==="speech"&&o.tailX!==undefined&&o.tailY!==undefined?'
          new = 'o.type==="speech"&&o.tailEnabled!==false&&o.tailX!==undefined&&o.tailY!==undefined?'
          assert old in s, 'tail handle anchor not found'
          s = s.replace(old, new, 1)

          old = '<div className="panel-editor-tools-head"><h3>Textlager</h3><button className="primary-button compact-button" type="button" onClick={()=>addOverlay(pg.id,pl.id,"speech")}>+ Lägg till bubbla</button></div>'
          new = '<div className="panel-editor-tools-head"><h3>Textlager</h3><div className="panel-editor-add-actions"><button className="primary-button compact-button" type="button" onClick={()=>addOverlay(pg.id,pl.id,"speech")}>+ Pratbubbla</button><button className="text-button compact-button" type="button" onClick={()=>addOverlay(pg.id,pl.id,"caption")}>+ Berättarruta</button></div></div>'
          assert old in s, 'add buttons anchor not found'
          s = s.replace(old, new, 1)

          old = '<label>Text<input value={o.text} onChange={(e)=>updateOverlay(pg.id,pl.id,o.id,{text:e.target.value})}/></label><div className="type-grid">'
          new = '<label>Typ<select value={o.type} onChange={(e)=>{const type=e.target.value as OverlayType;updateOverlay(pg.id,pl.id,o.id,{type,tailEnabled:type==="speech",tailX:type==="speech"?(o.tailX??o.x+o.width*.65):undefined,tailY:type==="speech"?(o.tailY??o.y+o.height*1.15):undefined,roundness:type==="caption"?(o.roundness??18):(o.roundness??60)});}}><option value="speech">Pratbubbla</option><option value="caption">Berättarruta</option><option value="thought">Tankebubbla</option><option value="sfx">SFX</option></select></label><label>Text<input value={o.text} onChange={(e)=>updateOverlay(pg.id,pl.id,o.id,{text:e.target.value})}/></label><div className="type-grid">'
          assert old in s, 'text field anchor not found'
          s = s.replace(old, new, 1)

          old = '{o.type==="speech"?<div className="number-grid"><label>Svansböjning<input type="number" min="-100" max="100" value={o.tailCurve??0} onChange={(e)=>updateOverlay(pg.id,pl.id,o.id,{tailCurve:Math.max(-100,Math.min(100,Number(e.target.value)||0))})}/></label><label>Rotbredd<input type="number" min="0" max="100" value={o.tailRootWidth??50} onChange={(e)=>updateOverlay(pg.id,pl.id,o.id,{tailRootWidth:Math.max(0,Math.min(100,Number(e.target.value)||0))})}/></label><label>Rundning<input type="number" min="0" max="100" value={o.roundness??60} onChange={(e)=>updateOverlay(pg.id,pl.id,o.id,{roundness:Math.max(0,Math.min(100,Number(e.target.value)||0))})}/></label></div>:null}'
          new = '{o.type==="speech"?<><label className="tail-toggle"><input type="checkbox" checked={o.tailEnabled!==false} onChange={(e)=>updateOverlay(pg.id,pl.id,o.id,{tailEnabled:e.target.checked,tailX:e.target.checked?(o.tailX??o.x+o.width*.65):o.tailX,tailY:e.target.checked?(o.tailY??o.y+o.height*1.15):o.tailY})}/> Svans</label>{o.tailEnabled!==false?<div className="number-grid"><label>Svansböjning<input type="number" min="-100" max="100" value={o.tailCurve??0} onChange={(e)=>updateOverlay(pg.id,pl.id,o.id,{tailCurve:Math.max(-100,Math.min(100,Number(e.target.value)||0))})}/></label><label>Rotbredd<input type="number" min="0" max="100" value={o.tailRootWidth??50} onChange={(e)=>updateOverlay(pg.id,pl.id,o.id,{tailRootWidth:Math.max(0,Math.min(100,Number(e.target.value)||0))})}/></label><label>Rundning<input type="number" min="0" max="100" value={o.roundness??60} onChange={(e)=>updateOverlay(pg.id,pl.id,o.id,{roundness:Math.max(0,Math.min(100,Number(e.target.value)||0))})}/></label></div>:<label>Rundning<input type="number" min="0" max="100" value={o.roundness??60} onChange={(e)=>updateOverlay(pg.id,pl.id,o.id,{roundness:Math.max(0,Math.min(100,Number(e.target.value)||0))})}/></label>}</>:o.type==="caption"?<label>Rundning<input type="number" min="0" max="100" value={o.roundness??18} onChange={(e)=>updateOverlay(pg.id,pl.id,o.id,{roundness:Math.max(0,Math.min(100,Number(e.target.value)||0))})}/></label>:null}'
          assert old in s, 'speech controls anchor not found'
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "ComicBook AI Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "Add tail toggle and narrator captions"
          git push
