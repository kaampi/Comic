name: Fix style preview rendering
on:
  push:
    paths:
      - '.github/fix-style-preview-rendering.trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: node scripts/fix-style-preview-rendering.mjs
      - run: npm ci
      - run: npm run build
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix built-in style preview rendering" || exit 0
          git push
