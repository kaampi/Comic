name: Connect style previews

on:
  push:
    paths:
      - '.github/workflows/connect-style-previews.yml'

permissions:
  contents: write

jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node scripts/connect-style-previews.mjs
      - run: npm ci
      - run: npm run build
      - name: Commit connected previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Connect style preview library" || exit 0
          git push
