name: Patch selected overlay editor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-selected-overlay-editor.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python scripts/patch_contextual_editor.py
      - name: Commit patch
        run: |
          git config user.name "ComicBook AI Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/App.tsx src/styles.css
          git commit -m "Make panel editor selection contextual"
          git push
